name: Deploy GitHub Pages

on:
    push:
        branches:
            - main
        paths:
            - "index.html"
            - "CNAME"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Build site directory
              run: |
                  mkdir -p _site
                  cp index.html _site/
                  if [ -f CNAME ]; then cp CNAME _site/; fi
                  if [ -d images ]; then cp -r images _site/; fi

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
