name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (e.g. v0.12.2)"
                required: true
                default: "v0.12.2"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

              
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci || npm install

            - name: Build extension
              run: npm run build

            - name: Determine tag name
              id: vars
              run: |
                  if [ -n "${{ github.event.inputs.tag }}" ]; then
                    echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
                  else
                    echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                  fi

            - name: Sync package version with tag
              run: |
                  TAG_VER="${{ steps.vars.outputs.tag }}"
                  npm version "${TAG_VER#v}" --no-git-tag-version --allow-same-version

            - name: Package extension (.vsix)
              run: npx --yes @vscode/vsce package --no-git-tag-version

            - name: Publish to Open VSX Registry
              run: npx --yes ovsx publish *.vsix --skip-duplicate
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.vars.outputs.tag }}
                  name: ${{ steps.vars.outputs.tag }}
                  files: "*.vsix"
                  generate_release_notes: true
